name: Build TRELLIS.2 Worker Image

# Mac 에서는 이 이미지를 못 만든다. 로컬 도커는 aarch64 인데 이미지는 x86_64 CUDA 이고,
# nvdiffrast/CuMesh/FlexGEMM 를 nvcc 로 컴파일한다 — 에뮬레이션으로는 몇 시간 끌다 깨진다.
# 그래서 빌드는 전부 GitHub 의 x86 러너에서 한다.

on:
  push:
    # 브랜치를 안 건다. 이 레포는 feat/* 에서 작업 중이고, gh workflow run 은
    # 워크플로 파일이 기본 브랜치에 있어야만 먹는다 — main 에 머지되기 전까지
    # 빌드를 못 돌리는 상황을 피한다.
    paths:
      - 'runpod/**'
      - '.github/workflows/build-runpod.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/trellis2-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CUDA devel 베이스 + torch 2.6 + 컴파일된 확장까지 얹으면 20GB 를 넘긴다.
      # 기본 러너의 여유 디스크(~14GB)로는 못 버틴다. 안 쓰는 SDK 를 먼저 지운다.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # 기본 docker 드라이버는 캐시 export 를 못 한다("Cache export is not supported
      # for the docker driver"). 아래 cache-to 를 쓰려면 docker-container 드라이버가 필요하다.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./runpod
          file: ./runpod/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # buildx 는 기본으로 provenance attestation 을 붙이는데, 그러면 결과물이
          # 단일 매니페스트가 아니라 OCI index(amd64 + unknown/unknown)가 된다.
          # RunPod 은 이 index 를 못 풀어 이미지 pull 에 실패하고 워커가 unhealthy 로 떨어진다.
          # 끄면 평범한 단일 플랫폼 매니페스트가 나온다.
          provenance: false
          sbom: false
          # 레지스트리 캐시. handler.py 만 고친 재빌드가 nvcc 확장을 다시 굽지 않게 한다
          # — 이게 없으면 한 줄 수정에도 매번 40~70분이다. (GHA 캐시는 10GB 한도라 이 이미지엔 못 씀)
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
